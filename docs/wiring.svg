<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Helvetica, Arial, sans-serif">
  <title>Schema di collegamento JonixLUG-AQI V2</title>
  <desc>Wemos D1 con BME280 (I2C) e SDS011 (UART)</desc>
  <rect width="900" height="580" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">JonixLUG-AQI V2: schema di collegamento</text>

  <!-- Wemos D1 -->
  <rect x="340" y="80" width="220" height="360" rx="10" fill="#e8f1fb" stroke="#1f4e79" stroke-width="3"/>
  <text x="450" y="115" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f4e79">Wemos D1</text>
  <text x="450" y="136" text-anchor="middle" font-size="12" fill="#1f4e79">ESP8266, formato UNO</text>

  <g font-size="14" fill="#1a1a1a">
    <text x="354" y="165">3V3</text>
    <text x="354" y="215">D4 (GPIO4)</text>
    <text x="354" y="265">D3 (GPIO5)</text>
    <text x="354" y="315">GND</text>
    <text x="546" y="165" text-anchor="end">5V</text>
    <text x="546" y="215" text-anchor="end">D6 (GPIO12)</text>
    <text x="546" y="265" text-anchor="end">D5 (GPIO14)</text>
    <text x="546" y="315" text-anchor="end">GND</text>
  </g>
  <text x="354" y="345" font-size="11" fill="#555">(D4 = SDA, D3 = SCL,</text>
  <text x="354" y="360" font-size="11" fill="#555">oppure pin D14 e D15)</text>

  <!-- Jack 12V -->
  <rect x="410" y="440" width="80" height="34" rx="4" fill="#444" stroke="#222" stroke-width="2"/>
  <text x="450" y="462" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">12 V DC</text>
  <text x="450" y="492" text-anchor="middle" font-size="11" fill="#555">jack di alimentazione (primo test: USB)</text>

  <!-- BME280 -->
  <rect x="40" y="110" width="160" height="230" rx="8" fill="#eaf7ea" stroke="#2e7d32" stroke-width="3"/>
  <text x="120" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32">BME280</text>
  <text x="120" y="160" text-anchor="middle" font-size="12" fill="#2e7d32">I2C</text>
  <g font-size="14" fill="#1a1a1a" text-anchor="end">
    <text x="190" y="165">VIN</text>
    <text x="190" y="215">SDA</text>
    <text x="190" y="265">SCL</text>
    <text x="190" y="315">GND</text>
  </g>

  <!-- SDS011 -->
  <rect x="700" y="110" width="160" height="230" rx="8" fill="#fdf1e3" stroke="#b45f06" stroke-width="3"/>
  <text x="780" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#b45f06">SDS011</text>
  <text x="780" y="160" text-anchor="middle" font-size="12" fill="#b45f06">UART 9600</text>
  <g font-size="14" fill="#1a1a1a">
    <text x="710" y="165">5V</text>
    <text x="710" y="215">TX</text>
    <text x="710" y="265">RX</text>
    <text x="710" y="315">GND</text>
  </g>

  <!-- Fili BME280 -->
  <g stroke-width="4" stroke-linecap="round">
    <line x1="200" y1="160" x2="340" y2="160" stroke="#d32f2f"/>
    <line x1="200" y1="210" x2="340" y2="210" stroke="#1565c0"/>
    <line x1="200" y1="260" x2="340" y2="260" stroke="#f9a825"/>
    <line x1="200" y1="310" x2="340" y2="310" stroke="#222222"/>
  </g>
  <!-- Fili SDS011 -->
  <g stroke-width="4" stroke-linecap="round">
    <line x1="560" y1="160" x2="700" y2="160" stroke="#d32f2f"/>
    <line x1="560" y1="210" x2="700" y2="210" stroke="#ef6c00"/>
    <line x1="560" y1="260" x2="700" y2="260" stroke="#7b1fa2"/>
    <line x1="560" y1="310" x2="700" y2="310" stroke="#222222"/>
  </g>
  <!-- Punti -->
  <g fill="#fff" stroke="#222" stroke-width="2">
    <circle cx="200" cy="160" r="5"/><circle cx="200" cy="210" r="5"/><circle cx="200" cy="260" r="5"/><circle cx="200" cy="310" r="5"/>
    <circle cx="340" cy="160" r="5"/><circle cx="340" cy="210" r="5"/><circle cx="340" cy="260" r="5"/><circle cx="340" cy="310" r="5"/>
    <circle cx="560" cy="160" r="5"/><circle cx="560" cy="210" r="5"/><circle cx="560" cy="260" r="5"/><circle cx="560" cy="310" r="5"/>
    <circle cx="700" cy="160" r="5"/><circle cx="700" cy="210" r="5"/><circle cx="700" cy="260" r="5"/><circle cx="700" cy="310" r="5"/>
  </g>

  <!-- Etichette sui fili -->
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="270" y="152">3,3 V</text>
    <text x="270" y="202">dati</text>
    <text x="270" y="252">clock</text>
    <text x="270" y="302">massa</text>
    <text x="630" y="152">5 V</text>
    <text x="630" y="202">TX sensore → D6</text>
    <text x="630" y="252">RX sensore ← D5</text>
    <text x="630" y="302">massa</text>
  </g>

  <!-- Note -->
  <g font-size="13" fill="#1a1a1a">
    <text x="40" y="530" font-weight="bold">Attenzione</text>
    <text x="40" y="550">TX e RX sono incrociati: il TX del sensore va al Wemos, l'RX del sensore esce dal Wemos.</text>
    <text x="40" y="568">BME280 solo a 3,3 V. I fili CTL, 1 µm e 2,5 µm dell'SDS011 restano scollegati.</text>
  </g>
</svg>
